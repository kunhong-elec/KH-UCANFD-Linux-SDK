name: Sync public SDK to Gitee

on:
  schedule:
    - cron: '27 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitee-sdk-sync

jobs:
  sync:
    if: github.repository == 'kunhong-elec/KH-UCANFD-Linux-SDK' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Sync master, tags and releases
        env:
          GH_TOKEN: ${{ github.token }}
          GITEE_TOKEN: ${{ secrets.GITEE_SDK_TOKEN }}
          GITEE_USERNAME: ${{ vars.GITEE_SDK_USERNAME }}
        run: bash .github/scripts/sync-gitee.sh
