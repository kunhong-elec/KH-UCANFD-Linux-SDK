name: SDK Release Install

run-name: SDK install · ${{ inputs.tag || github.event.release.tag_name || 'latest' }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (defaults to the latest stable release)
        required: false
        type: string

permissions: {}

jobs:
  dispatch:
    name: Queue install check on the default branch
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch the published release
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # Keep installation results on the branch tracked by the README badge.
          gh workflow run release-install.yml --repo "$GITHUB_REPOSITORY" \
            --ref "$DEFAULT_BRANCH" --raw-field "tag=$RELEASE_TAG"

  install:
    name: Download and install on ${{ matrix.image }}
    if: github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - ubuntu-26.04
          - ubuntu-26.04-arm
    runs-on: ${{ matrix.image }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Record the release and runner platform
        id: platform
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RUNNER_IMAGE: ${{ matrix.image }}
        run: |
          releases="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases"
          if [[ -z "$RELEASE_TAG" ]]; then
            latest=$(curl -fsSL --retry 3 -o /dev/null -w '%{url_effective}' "$releases/latest")
            [[ "$latest" == "$releases/tag/"* ]]
            RELEASE_TAG="${latest##*/}"
          fi
          [[ "$RELEASE_TAG" =~ ^[[:alnum:]][[:alnum:]_.-]*$ ]]
          . /etc/os-release
          arch=$(uname -m)
          kernel=$(uname -r)
          printf 'Testing SDK %s on %s (%s), kernel %s\n' "$RELEASE_TAG" "$PRETTY_NAME" "$arch" "$kernel" | tee -a "$GITHUB_STEP_SUMMARY"
          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          jq -n --arg image "$RUNNER_IMAGE" --arg distro "$PRETTY_NAME" \
            --arg arch "$arch" --arg kernel "$kernel" --arg tag "$RELEASE_TAG" \
            --argjson attempt "$GITHUB_RUN_ATTEMPT" \
            '{image: $image, distro: $distro, arch: $arch, kernel: $kernel, tag: $tag, attempt: $attempt}' \
            > "$RUNNER_TEMP/platform.json"

      - name: Save the tested platform
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-platform-${{ matrix.image }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/platform.json
          if-no-files-found: error

      - name: Download and verify the published SDK ZIP
        id: sdk
        env:
          RELEASE_TAG: ${{ steps.platform.outputs.tag }}
        run: |
          releases="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases"
          mkdir -p "$RUNNER_TEMP/sdk-release"
          cd "$RUNNER_TEMP/sdk-release"
          package=KH-UCANFD_Linux_SDK.zip
          for asset in "$package" "$package.sha256"; do
            curl -fsSL --retry 3 --max-time 120 -o "$asset" "$releases/download/$RELEASE_TAG/$asset"
          done
          sha256sum --check --strict "$package.sha256"
          unzip -q "$package"
          directory="KH-UCANFD_Linux_SDK-${RELEASE_TAG#v}"
          if [[ ! -d "$directory" ]]; then
            directory=KH-UCANFD_Linux_SDK
          fi
          if [[ ! -x "$directory/build.sh" ]]; then
            echo "::error::SDK $RELEASE_TAG is missing an executable $directory/build.sh"
            exit 1
          fi
          printf 'directory=%s/%s\n' "$PWD" "$directory" >> "$GITHUB_OUTPUT"

      - name: Install prerequisites and SDK
        working-directory: ${{ steps.sdk.outputs.directory }}
        run: |
          sudo ./build.sh -p
          # Minimal cloud images may ship CAN support in the extra modules package.
          if ! sudo modprobe --quiet can-dev; then
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe can-dev
          fi
          sudo ./build.sh

      - name: Verify the installed driver and tools
        run: |
          modinfo -F depends kcan
          if ! sudo modprobe kcan; then
            sudo dmesg | grep -F 'kcan:' | tail -n 30 || true
            exit 1
          fi
          test -d /sys/module/kcan
          [[ "$(modinfo -F vermagic kcan)" == "$(uname -r) "* ]]
          modinfo -F version kcan
          command -v lskcan
          kcan_fw_upgrade --help > /dev/null

  report:
    name: Update the README with per-kernel results
    needs: install
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: install-platform-*
          path: ${{ runner.temp }}/install-platforms
      - name: Publish the install results
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/update-release-ci.py "$RUNNER_TEMP/install-platforms"
