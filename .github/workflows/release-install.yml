name: SDK Release Install

run-name: SDK install · ${{ inputs.tag || github.event.release.tag_name || 'latest' }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (defaults to the latest stable release)
        required: false
        type: string

permissions: {}

jobs:
  dispatch:
    name: Queue install check on the default branch
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch the published release
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # Keep installation results on the branch tracked by the README badge.
          gh workflow run release-install.yml --repo "$GITHUB_REPOSITORY" \
            --ref "$DEFAULT_BRANCH" --raw-field "tag=$RELEASE_TAG"

  install:
    name: Download and install on ${{ matrix.image }}
    if: github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.image }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Download and verify the published SDK ZIP
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          releases="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases"
          if [[ -z "$RELEASE_TAG" ]]; then
            latest=$(curl -fsSL --retry 3 -o /dev/null -w '%{url_effective}' "$releases/latest")
            [[ "$latest" == "$releases/tag/"* ]]
            RELEASE_TAG="${latest##*/}"
          fi
          [[ "$RELEASE_TAG" =~ ^[[:alnum:]][[:alnum:]_.-]*$ ]]
          printf 'Testing release %s on %s\n' "$RELEASE_TAG" "$(uname -r)" | tee -a "$GITHUB_STEP_SUMMARY"

          mkdir -p "$RUNNER_TEMP/sdk-release"
          cd "$RUNNER_TEMP/sdk-release"
          package=KH-UCANFD_Linux_SDK.zip
          for asset in "$package" "$package.sha256"; do
            curl -fsSL --retry 3 --max-time 120 -o "$asset" "$releases/download/$RELEASE_TAG/$asset"
          done
          sha256sum --check --strict "$package.sha256"
          unzip -q "$package"

      - name: Install prerequisites and SDK
        working-directory: ${{ runner.temp }}/sdk-release/KH-UCANFD_Linux_SDK
        run: |
          sudo ./build.sh -p
          # Minimal cloud images may ship CAN support in the extra modules package.
          if ! sudo modprobe --quiet can-dev; then
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe can-dev
          fi
          sudo ./build.sh

      - name: Verify the installed driver and tools
        run: |
          modinfo -F depends kcan
          if ! sudo modprobe kcan; then
            sudo dmesg | grep -F 'kcan:' | tail -n 30 || true
            exit 1
          fi
          test -d /sys/module/kcan
          [[ "$(modinfo -F vermagic kcan)" == "$(uname -r) "* ]]
          modinfo -F version kcan
          command -v lskcan
          kcan_fw_upgrade --help > /dev/null
