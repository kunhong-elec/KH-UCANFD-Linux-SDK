name: Publish Linux SDK

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sdk-release-${{ github.ref }}

jobs:
  release:
    if: github.repository == 'kunhong-elec/KH-UCANFD-Linux-SDK' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Package and verify SDK
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mapfile -t files < <(sed -E 's/^[[:space:]]+|[[:space:]]+$//g; /^($|#)/d' release_filelist.txt)
          (( ${#files[@]} > 0 ))
          name=KH-UCANFD_Linux_SDK
          git archive --format=zip --prefix="$name/" -o "$RUNNER_TEMP/$name.zip" HEAD "${files[@]}"
          cd "$RUNNER_TEMP"
          sha256sum "$name.zip" > "$name.zip.sha256"
          unzip -q "$name.zip"
          sudo apt-get update
          sudo apt-get install -y linux-headers-generic libpopt-dev
          headers=$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' | sort -V | tail -n 1)
          [[ -n "$headers" ]]
          make -C "$name" -j2 KERNEL_LOCATION="$headers" all
          [[ -s "$name/driver/kcan.ko" && -x "$name/tools/fw_tool/kcan_fw_tool" ]]
          python3 "$name/tools/fw_tool/kcan_fw_upgrade.py" --help > /dev/null
      - name: Publish release and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag=$GITHUB_REF_NAME
          [[ $(sed -n '1p' release_notes.txt) == *" - $tag - content" ]]
          awk 'NR > 1 && /^[0-9]{4}-[0-9]{2}-[0-9]{2} - / {exit} NR > 1' release_notes.txt > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"
          if gh release view "$tag" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/draft"; then
            if [[ $(cat "$RUNNER_TEMP/draft") == false ]]; then
              exit 0
            fi
          else
            gh release create "$tag" --draft --verify-tag --title "KH-UCANFD Linux SDK $tag" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release upload "$tag" "$RUNNER_TEMP/KH-UCANFD_Linux_SDK.zip" "$RUNNER_TEMP/KH-UCANFD_Linux_SDK.zip.sha256" --clobber
          gh release edit "$tag" --draft=false
